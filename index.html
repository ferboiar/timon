<!DOCTYPE html>
<html lang="es">

<head>
      <meta charset="UTF-8">
      <link rel="icon" href="/favicon.ico">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script>
          // Aplica la apariencia recordada antes de pintar la página, para que no haya parpadeo al cargar (DC-26)
          (function () {
              try {
                  var modo = localStorage.getItem('timon.colorScheme') || 'dark';
                  var oscuro = modo === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : modo !== 'light';
                  document.documentElement.classList.toggle('app-dark', oscuro);
              } catch (e) {}
          })();
      </script>
      <title>Timón - Una aplicación de gestión financiera domestica</title>
      <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet">
</head>

<body>
      <div id="app"></div>
      <script type="module" src="/src/main.js"></script>
</body>

</html>
